name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# Предотвращение одновременных запусков одного workflow для одной ветки
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION_MATRIX: '["3.11", "3.12"]'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # C1. Сборка и тесты
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # C2. Кэширование зависимостей
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache Python dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-${{ matrix.python-version }}-pip-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.python-version }}-pip-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run linter
      run: |
        ruff check app/ tests/
        isort --check app/ tests/
        black --check app/ tests/
      continue-on-error: true

    - name: Run tests with coverage
      env:
        # C3. Секреты для тестирования (маскируются автоматически)
        POSTGRES_HOST: ${{ secrets.POSTGRES_HOST || 'localhost' }}
        POSTGRES_PORT: ${{ secrets.POSTGRES_PORT || '5432' }}
        POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'wishlist_test' }}
        POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'user' }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'password' }}
      run: |
        pytest tests/ --cov=app --cov-report=xml --cov-report=html --cov-report=term

    # C4. Артефакты - отчеты тестов и покрытия
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
        path: |
          coverage.xml
          htmlcov/
        retention-days: 30

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
        path: |
          .pytest_cache/
        retention-days: 7

  # C1. Сборка Docker образа
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # C2. Кэширование Docker слоев
    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

    # C4. Артефакты - сохранение Docker образа
    - name: Save Docker image as artifact
      uses: actions/upload-artifact@v4
      if: github.event_name != 'pull_request'
      with:
        name: docker-image
        path: /tmp/.buildx-cache
        retention-days: 7

  # C5. CD/промоушн - эмуляция деплоя
  deploy-staging:
    name: Deploy to Staging (Mock)
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    environment:
      name: staging
      url: https://staging.example.com

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Mock deployment to staging
      env:
        # C3. Секреты для staging окружения
        STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        STAGING_JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
        STAGING_API_KEY: ${{ secrets.STAGING_API_KEY }}
      run: |
        echo "Deploying to staging environment..."
        echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
        echo "Environment: staging"
        echo "DB URL: [MASKED]"
        echo "Deployment simulation completed successfully"

    - name: Health check (mock)
      run: |
        echo "Checking staging health..."
        sleep 2
        echo "Staging is healthy"

  deploy-production:
    name: Deploy to Production (Mock)
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://example.com

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Mock deployment to production
      env:
        # C3. Секреты для production окружения
        PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
        PROD_JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
        PROD_API_KEY: ${{ secrets.PROD_API_KEY }}
      run: |
        echo "Deploying to production environment..."
        echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
        echo "Environment: production"
        echo "DB URL: [MASKED]"
        echo "Deployment simulation completed successfully"
        # В реальном проекте здесь был бы реальный деплой

  # C4. Отчет
  summary:
    name: CI/CD Summary
    runs-on: ubuntu-latest
    needs: [test, build]
    if: always()

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Generate summary
      run: |
        echo "## CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Test Results" >> $GITHUB_STEP_SUMMARY
        echo "- Status: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Build Results" >> $GITHUB_STEP_SUMMARY
        echo "- Status: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "Check the Artifacts section for coverage reports and Docker images" >> $GITHUB_STEP_SUMMARY
